[bin]
path = /bin/
interface = ip, ifconfig
trace = ip, ping
node_ip = ping
DNS = dig, host
web_resource = curl, wget, telnet, nc
path_to_node = traceroute, mtr, tracepath
ping = ping, mtr, iperf3

[ip link]
arg = link
[ifconfig]
arg = ""
[ip route]
arg = route show
[ping]
arg = -c 4 8.8.8.8
[ping trace]
arg = -c 4 192.168.1.1
[nslookup]
arg = google.com
[dig]
arg = +short google.com
[host]
arg = google.com
[curl]
arg = -I -s --max-time 5 https://google.com
[wget]
arg = --spider -q https://google.com
[telnet]
arg = google.com 80
[nc]
arg = -zv -w 2 google.com 443
[traceroute]
arg = -n 8.8.8.8
[mtr]
arg = --report -c 5 8.8.8.8
[tracepath]
arg = 8.8.8.8
[iperf3]
arg = -c speedtest.net -t 5